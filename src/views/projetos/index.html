
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust CRUD</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        a, button {
            cursor: pointer;
        }

        a {
            color: #df9f20;
            text-decoration: none;
        }

        .novo {
            display: inline-block;
            background: #df9f20;
            color: #111;
            padding: 12px 18px;
            border-radius: 5px;
            margin: 20px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #333;
            text-align: left;
        }

        button {
            background: #9e3333;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
        }

        form {
            display: inline;
        }
    </style>
</head>

<body>

    <h1>Gerenciamento de Projetos</h1>

    <p>Controle seus projetos cadastrados.</p>

    <a class="novo" href="/projetos/novo">
        + Novo projeto
    </a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Descrição</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            {{PROJETOS}}
        </tbody>
    </table>

</body>
</html>
