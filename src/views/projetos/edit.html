
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Projeto</title>

    <style>
        body {
            background: #111;
            color: #eee;
            font-family: Arial;
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            background: #222;
            color: white;
            border: 1px solid #444;
        }

        button {
            padding: 12px 20px;
            background: #df9f20;
            border: none;
            cursor: pointer;
        }

        a {
            color: #df9f20;
        }
    </style>
</head>

<body>

    <h1>Editar Projeto #{{ID}}</h1>

    <form action="/projetos/{{ID}}/atualizar" method="POST">

        <label>Título</label>
        <input
            type="text"
            name="titulo"
            value="{{TITULO}}"
            required
        >

        <label>Descrição</label>
        <textarea
            name="descricao"
            required
        >{{DESCRICAO}}</textarea>

        <button type="submit">Salvar alterações</button>

    </form>

    <p><a href="/">Voltar</a></p>

</body>
</html>
